name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Actions はコミット SHA で固定する（タグの付け替えによる差し替えを防ぐ）
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # ブラウザ用ファイルの上限（N-01: gzip 後 60KB）
      - run: test "$(gzip -9c dist/sealform.js | wc -c)" -le 61440

  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - run: python server/python/test_sealform_check.py
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "7.4"
      - run: php server/php/test.php
      - run: php -l wordpress/sealform/sealform.php

  # 実ブラウザで送信し、サーバーに届いた中身に平文が無いことを確かめる
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node examples/shared/demo.mjs
      - run: npx playwright test --project=chromium --project=firefox --project=webkit

  # WordPress + Contact Form 7 の実環境（期限切れの鍵・必須の空欄・添付・平文の直接送信）
  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:wordpress
      - run: node examples/shared/demo.mjs
      - run: docker compose -f examples/wordpress/compose.yml up -d
      - run: timeout 120 sh -c 'until curl -s -o /dev/null localhost:8795; do sleep 2; done'
      - run: sh examples/wordpress/setup.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=wordpress
        env:
          WP_URL: http://localhost:8795
