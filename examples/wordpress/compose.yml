# WordPress + Contact Form 7 で sealform プラグインを試す環境（手元の検証用）
#   npm run build && npm run build:wordpress && node examples/shared/demo.mjs
#   docker compose -f examples/wordpress/compose.yml up -d
#   sh examples/wordpress/setup.sh      → http://localhost:8795/soudan/
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-local-only
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
  wordpress:
    image: wordpress:7.1-php8.3-apache
    depends_on: [db]
    ports: ["8795:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local-only
    volumes:
      - wp:/var/www/html
      - ../../dist/wordpress/sealform:/var/www/html/wp-content/plugins/sealform:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  cli:
    image: wordpress:cli-2-php8.3
    depends_on: [wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local-only
    volumes:
      - wp:/var/www/html
      - ../../dist/wordpress/sealform:/var/www/html/wp-content/plugins/sealform:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ../.data:/sealform-data:ro
    entrypoint: ["wp"]
    profiles: ["cli"]
volumes:
  wp:
